name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app.py rag_core.py evaluation tests
      - run: pytest -q
      - run: python evaluation/retrieval_eval.py --minimum-hit-rate 0.8
      - run: python evaluation/embedding_eval.py --minimum-hit-rate 0.8
      - run: python evaluation/pipeline_eval.py --minimum-accuracy 0.8 --minimum-slice-accuracy 0.8 --output evaluation/pipeline_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grounding-evaluation-${{ github.sha }}
          path: evaluation/pipeline_report.json
          if-no-files-found: ignore
          retention-days: 14
      - run: python -m compileall app.py rag_core.py demo.py

